<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    UHAS MSA Room Allocation
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<main>

  <header>

    <h1>
      UHAS MSA Room Allocation
    </h1>

    <p>
      Self-Service Accommodation Portal
    </p>

  </header>


  <section id="login">

    <h2>
      Student Login
    </h2>

    <p>
      Enter your index number and unique access code.
    </p>

    <label for="index">
      Index Number
    </label>

    <input
      id="index"
      type="text"
      autocomplete="username"
      placeholder="e.g. UHAS202400001"
    >


    <label for="accessCode">
      Unique Access Code
    </label>

    <input
      id="accessCode"
      type="password"
      autocomplete="current-password"
      placeholder="Enter your access code"
    >

    <button id="loginButton">
      Continue
    </button>

    <p
      id="msg"
      role="alert"
    ></p>

  </section>


  <section
    id="rooms"
    hidden
  >

    <h2>
      Available Rooms
    </h2>

    <div
      id="grid"
      class="grid"
    ></div>

  </section>


  <section
    id="allocation"
    hidden
  ></section>

</main>


<script
  type="module"
  src="app.js"
></script>

</body>

</html>
