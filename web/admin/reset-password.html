<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f4f7f9;
    }
    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,.08);
    }
    h1{margin:0 0 8px;font-size:24px}
    p{color:#666;line-height:1.5}
    label{display:block;margin:18px 0 6px;font-weight:600}
    input{
      width:100%;
      padding:13px;
      border:1px solid #ccc;
      border-radius:7px;
      font-size:16px;
    }
    button{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:7px;
      background:#006b5f;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    button:disabled{opacity:.6}
    #message{margin-top:18px;font-weight:600}
    .error{color:#b00020}
    .success{color:#087f23}
    a{color:#006b5f}
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Admin Password</h1>
    <p>Enter and confirm your new administrator password.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input id="password" type="password" minlength="8" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" minlength="8" required>

      <button id="resetButton" type="submit">Update Password</button>
    </form>

    <div id="message"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '../config.js';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('resetForm');
    const button = document.getElementById('resetButton');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        message.className = 'error';
        message.textContent = 'Password must be at least 8 characters.';
        return;
      }

      if (password !== confirmPassword) {
        message.className = 'error';
        message.textContent = 'Passwords do not match.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';
      message.textContent = '';

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        message.className = 'error';
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = 'Update Password';
        return;
      }

      message.className = 'success';
      message.innerHTML =
        'Password updated successfully. <a href="./">Go to Admin Login</a>';

      form.reset();
      button.style.display = 'none';
    });
  </script>
</body>
</html>
