name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
concurrency: supabase-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env: {SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'}
      - run: supabase db push
        env: {SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'}
      - run: supabase functions deploy rooms
        env: {SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'}
      - run: supabase functions deploy allocate-room
        env: {SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'}
      - run: supabase functions deploy my-allocation
        env: {SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'}
